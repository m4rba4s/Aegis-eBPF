[package]
name = "aegis-cli-fuzz"
version = "4.3.0-rc.1"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
anyhow = "1.0"
libfuzzer-sys = "0.4"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[dependencies.toml]
version = "0.8"

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
