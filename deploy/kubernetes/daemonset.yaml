apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aegis-firewall
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis
    app.kubernetes.io/component: firewall
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis
    spec:
      hostNetwork: true
      serviceAccountName: aegis
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
      containers:
        - name: aegis
          image: ghcr.io/m4rba4s/aegis-ebpf:latest
          workingDir: /etc/aegis
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
            seccompProfile:
              type: Unconfined
            capabilities:
              add:
                - NET_ADMIN
                - BPF
                - PERFMON
                - SETUID
                - SETGID
                - SETPCAP
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
            - name: aegis-config
              mountPath: /etc/aegis
          command:
            - /aegis-cli
          args:
            - --iface
            - eth0
            - daemon
          ports:
            - containerPort: 9100
              name: metrics
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 9100
              host: 127.0.0.1
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 9100
              host: 127.0.0.1
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: aegis-config
          configMap:
            name: aegis-config
            optional: true
