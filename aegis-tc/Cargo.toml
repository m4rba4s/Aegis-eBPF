[package]
name = "aegis-tc"
version = "4.3.0-rc.1"
edition = "2021"
license = "MIT"
description = "Aegis eBPF TC egress firewall program"

[dependencies]
aya-ebpf = "0.1.1"
aegis-common = { path = "../aegis-common", default-features = false }

[[bin]]
name = "aegis-tc"
path = "src/main.rs"

# BTF requires DWARF debug info — bpf-linker converts it.
# This crate is excluded from workspace, so it needs its own profile.
[profile.release]
debug = 2               # DWARF → BTF via bpf-linker
opt-level = "z"         # Minimize code size for eBPF verifier
codegen-units = 1       # Deterministic object
overflow-checks = false # No panic infra in no_std eBPF

[profile.dev]
debug = 2
opt-level = 1           # Some optimization even in dev (verifier is strict)
overflow-checks = false

