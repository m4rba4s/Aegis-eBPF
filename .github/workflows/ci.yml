name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  nonpriv-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - name: Install release gate tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file llvm protobuf-compiler python3-scapy
          cargo install bpf-linker --version 0.10.1 --locked
          cargo install cargo-audit --version 0.22.1 --locked
          cargo install cargo-deny --version 0.19.8 --locked
          cargo audit --stale || true
      - name: Non-privileged release gate
        run: ./scripts/release-gates.sh nonpriv
      - name: Packet replay driver syntax
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile scripts/packet-replay-lab.py
          test "$(python3 scripts/packet-replay-lab.py --list-cases | wc -l)" -eq 18
          python3 scripts/packet-replay-lab.py --self-test-validator
          python3 scripts/packet-replay-lab.py --validate-packets

  formal-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - name: Install formal verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless
          cargo install kani-verifier --version 0.67.0 --locked
          cargo kani setup
          curl -fL https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o /tmp/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /tmp/tla2tools.jar" | sha256sum -c -
      - name: Kani proofs
        run: ./verify.sh kani
      - name: TLA+ model checking
        run: TLA2TOOLS_JAR=/tmp/tla2tools.jar ./verify.sh tla

  privileged-runtime-lab:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, aegis-ebpf-lab]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Privileged lab release gate with bounded stress
        run: |
          sudo -E AEGIS_PACKET_REPLAY_DIR=/tmp/aegis-replay-${{ github.run_id }}-${{ github.run_attempt }} \
            AEGIS_STRESS_ITERATIONS=25 \
            CARGO_HOME=/tmp/aegis-cargo-home \
            ./scripts/release-gates.sh stress-lab
      - name: Archive replay artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: aegis-replay-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/aegis-replay-${{ github.run_id }}-${{ github.run_attempt }}

  portable-static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libelf-dev musl-tools protobuf-compiler
          cargo install bpf-linker --version 0.10.1 --locked
          rustup target add x86_64-unknown-linux-musl
      - name: Build eBPF objects
        run: cargo run --locked -p xtask -- build-all --profile release
      - name: Build static musl binary
        run: cargo build --locked --release --target x86_64-unknown-linux-musl -p aegis-cli
      - name: Validate portability
        run: |
          file target/x86_64-unknown-linux-musl/release/aegis-cli
          ldd target/x86_64-unknown-linux-musl/release/aegis-cli 2>&1 | grep -q "not a dynamic executable" || ldd target/x86_64-unknown-linux-musl/release/aegis-cli 2>&1 | grep -q "statically linked"
          target/x86_64-unknown-linux-musl/release/aegis-cli --version
      - name: Record portable build identity
        id: identity
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          checkout_commit="$(git rev-parse HEAD)"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' aegis-cli/Cargo.toml | head -1)"
          test "$checkout_commit" = "$CI_COMMIT"
          test -n "$SOURCE_COMMIT"
          test -n "$version"

          jq -n \
            --arg project "Aegis-eBPF" \
            --arg version "$version" \
            --arg target "x86_64-unknown-linux-musl" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg ci_checkout_commit "$checkout_commit" \
            --arg event "$GITHUB_EVENT_NAME" \
            '{
              project: $project,
              version: $version,
              target: $target,
              source_commit: $source_commit,
              ci_checkout_commit: $ci_checkout_commit,
              event: $event,
              note: "For pull_request events, ci_checkout_commit is the temporary GitHub merge commit."
            }' > target/aegis-ci-build-identity.json

          (
            cd target
            sha256sum \
              x86_64-unknown-linux-musl/release/aegis-cli \
              bpfel-unknown-none/release/aegis \
              bpfel-unknown-none/release/aegis-tc \
              aegis-ci-build-identity.json \
              > aegis-ci-SHA256SUMS
            sha256sum -c aegis-ci-SHA256SUMS
          )

          echo "name=aegis-${version}-x86_64-linux-musl-source-${SOURCE_COMMIT}-tree-${checkout_commit}" \
            >> "$GITHUB_OUTPUT"
      - name: Upload portable binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.identity.outputs.name }}
          path: |
            target/x86_64-unknown-linux-musl/release/aegis-cli
            target/bpfel-unknown-none/release/aegis
            target/bpfel-unknown-none/release/aegis-tc
            target/aegis-ci-build-identity.json
            target/aegis-ci-SHA256SUMS
