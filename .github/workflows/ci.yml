name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  nonpriv-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install release gate tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file llvm protobuf-compiler python3-scapy
          cargo install bpf-linker --locked
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
          cargo audit --stale || true
      - name: Non-privileged release gate
        run: ./scripts/release-gates.sh nonpriv
      - name: Verification crate tests
        run: |
          cargo fmt --manifest-path verification/Cargo.toml --all -- --check
          cargo clippy --manifest-path verification/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path verification/Cargo.toml
      - name: Verification fuzz target checks
        run: |
          cargo fmt --manifest-path verification/fuzz/Cargo.toml --all -- --check
          cargo clippy --manifest-path verification/fuzz/Cargo.toml --all-targets --all-features -- -D warnings
      - name: CLI config fuzz target checks
        run: |
          cargo fmt --manifest-path aegis-cli/fuzz/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path aegis-cli/fuzz/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Shell syntax
        run: bash -n install.sh deploy/deploy.sh scripts/check-tla.sh scripts/release-gates.sh verify.sh
      - name: Packet replay driver syntax
        run: |
          python3 -m py_compile scripts/packet-replay-lab.py
          test "$(python3 scripts/packet-replay-lab.py --list-cases | wc -l)" -eq 18
          python3 scripts/packet-replay-lab.py --validate-packets

  formal-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install formal verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless
          cargo install kani-verifier --version 0.67.0 --locked
          cargo kani setup
          curl -fL https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o /tmp/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /tmp/tla2tools.jar" | sha256sum -c -
      - name: Kani proofs
        run: ./verify.sh kani
      - name: TLA+ model checking
        run: TLA2TOOLS_JAR=/tmp/tla2tools.jar ./verify.sh tla

  privileged-runtime-lab:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, aegis-ebpf-lab]
    steps:
      - uses: actions/checkout@v6
      - name: Privileged lab release gate with bounded stress
        run: |
          sudo -E AEGIS_PACKET_REPLAY_DIR=/tmp/aegis-replay-${{ github.run_id }}-${{ github.run_attempt }} \
            AEGIS_STRESS_ITERATIONS=25 \
            CARGO_HOME=/tmp/aegis-cargo-home \
            ./scripts/release-gates.sh stress-lab
      - name: Archive replay artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aegis-replay-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/aegis-replay-${{ github.run_id }}-${{ github.run_attempt }}

  portable-static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libelf-dev musl-tools protobuf-compiler
          cargo install bpf-linker --locked
          rustup target add x86_64-unknown-linux-musl
      - name: Build eBPF objects
        run: cargo run -p xtask -- build-all --profile release
      - name: Build static musl binary
        run: cargo build --release --target x86_64-unknown-linux-musl -p aegis-cli
      - name: Validate portability
        run: |
          file target/x86_64-unknown-linux-musl/release/aegis-cli
          ldd target/x86_64-unknown-linux-musl/release/aegis-cli 2>&1 | grep -q "not a dynamic executable" || ldd target/x86_64-unknown-linux-musl/release/aegis-cli 2>&1 | grep -q "statically linked"
          target/x86_64-unknown-linux-musl/release/aegis-cli --version
      - name: Upload portable binary
        uses: actions/upload-artifact@v4
        with:
          name: aegis-portable-${{ github.sha }}
          path: |
            target/x86_64-unknown-linux-musl/release/aegis-cli
            target/bpfel-unknown-none/release/aegis
            target/bpfel-unknown-none/release/aegis-tc
