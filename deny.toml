# cargo-deny configuration for Aegis eBPF Firewall
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
]

# ============================================================
# ADVISORIES
# ============================================================
[advisories]
unmaintained = "all"
unsound = "all"
yanked = "warn"
# Waivers for informational advisories that do not affect our use case.
# Each waiver is scoped and documented.
ignore = [
    "RUSTSEC-2025-0141", # bincode is unmaintained
    "RUSTSEC-2024-0436", # paste is unmaintained
    "RUSTSEC-2026-0002", # lru IterMut unsoundness
    "RUSTSEC-2026-0097", # rand custom logger unsoundness
]

# ============================================================
# LICENSES
# ============================================================
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ============================================================
# BANS
# ============================================================
[bans]
multiple-versions = "warn"
wildcards = "allow"

# ============================================================
# SOURCES
# ============================================================
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
